<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Builder - Google Forms Clone</title>
    <link rel="stylesheet" href="styles.css">
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="landing-page" class="landing-page">
      <div class="landing-container">
        <h1 class="landing-title">Create Your Form</h1>
        <p class="landing-subtitle">Build beautiful forms in minutes</p>
        <button id="blank-form-btn" class="blank-form-button">
          <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          Start with Blank Form
        </button>
      </div>
    </div>

    <div id="form-builder" class="form-builder hidden">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="back-btn" class="toolbar-btn" title="Back to start">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <h2 class="toolbar-title">Form Builder</h2>
        </div>
        <div class="toolbar-right">
          <button id="preview-btn" class="toolbar-btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Preview
          </button>
          <button id="save-btn" class="toolbar-btn secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save Draft
          </button>
        </div>
      </header>

      <div class="builder-container">
        <aside class="sidebar">
          <h3 class="sidebar-title">Question Types</h3>
          <div class="question-types">
            <button class="question-type-btn" data-type="short-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="9" x2="20" y2="9"></line>
                <line x1="4" y1="15" x2="14" y2="15"></line>
              </svg>
              <span>Short Answer</span>
            </button>
            <button class="question-type-btn" data-type="long-text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="7" x2="20" y2="7"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="17" x2="14" y2="17"></line>
              </svg>
              <span>Paragraph</span>
            </button>
            <button class="question-type-btn" data-type="multiple-choice">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="2"></circle>
                <circle cx="12" cy="16" r="2"></circle>
              </svg>
              <span>Multiple Choice</span>
            </button>
            <button class="question-type-btn" data-type="checkbox">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="5" width="6" height="6"></rect>
                <rect x="3" y="13" width="6" height="6"></rect>
                <line x1="12" y1="8" x2="21" y2="8"></line>
                <line x1="12" y1="16" x2="21" y2="16"></line>
              </svg>
              <span>Checkboxes</span>
            </button>
            <button class="question-type-btn" data-type="dropdown">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="6" width="18" height="12" rx="2"></rect>
                <polyline points="8 10 12 14 16 10"></polyline>
              </svg>
              <span>Dropdown</span>
            </button>
          </div>
        </aside>

        <main class="editor-area">
          <div class="form-header-card card">
            <input
              type="text"
              id="form-title"
              class="form-title-input"
              placeholder="Untitled Form"
              value="Sample Customer Feedback Form"
            >
            <textarea
              id="form-description"
              class="form-description-input"
              placeholder="Form description"
              rows="2"
            >Please take a moment to share your feedback with us. Your input helps us improve our services.</textarea>
          </div>

          <div id="questions-container" class="questions-container">
          </div>

          <button id="add-question-btn" class="add-question-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            Add Question
          </button>
        </main>
      </div>
    </div>

    <div id="preview-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Form Preview</h2>
          <button id="close-preview-btn" class="close-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="preview-content" class="preview-content"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
